<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {%block title %}
        LEAR|CMMS
        {% endblock %}
    </title>
    <link rel="icon" type="image/png" href="{% static 'img/lear_mini_logo.png' %}">
    <!--local css-->
    <link href="{% static 'css/main.css' %}" rel="stylesheet">

    <!-- Local Bootstrap CSS -->
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <!-- Local Bootstrap Bundle JS -->

    <script src="{% static 'js/Chart.bundle.min.js' %} " defer></script>   
    
    <script src="{% static 'bootstrap/js/bootstrap.min.js' %}" defer></script>
    <script src="{% static 'js/main.js' %}" defer></script>
</head>
<body>
    <!-- Loader -->
    <div id="loader">
        <div class="text-center">
            <div class="spinner-border text-danger" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="loading-text">Chargement en cours...</p>
        </div>
    </div>


    
    <div class="d-flex">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="mb-4 text-center">
                <img src="{% static 'img/lear_logo.png' %}" alt="Lear Logo" class="img-fluid" style="max-height: 50px;">
            </div>


            <nav class="nav flex-column">
                <a href="{% url 'users:admin'  %}" class="nav-link link "><i class="fas fa-home me-2"></i>Accueil</a>
                <a href="user.html" class="nav-link link"><i class="fas fa-clipboard-list me-2"></i>Ordre
                    de travail</a>
                <a href="his-interv.html" class="nav-link link"><i class="fas fa-tools me-2"></i>Historique</a>
                <a href="breakdown.html" class="nav-link link"><i class="fas fa-exclamation-triangle me-2"></i>Arrêt</a>
                <a href="SPcards.html" class="nav-link link"><i class="fas fa-cogs me-2"></i>Machines</a>
                <a href="EQcards.html" class="nav-link link"><i class="fas fa-box me-2"></i>Équipement</a>
                <a href="department.html" class="nav-link link"><i class="fas fa-map-marker-alt me-2"></i>Zones</a>
                <a href="CEcards.html" class="nav-link link"><i class="fas fa-users me-2"></i>Utilisateurs</a>
            </nav>
        </aside>

        <!-- Main Content -->

        <div class="flex-grow-1">

            <!-- Header -->
            <header id="navbar">
                <div class="d-flex justify-content-between align-items-center px-3">
                    <h2 class="m-0">Bienvenue</h2>
            
                    <div class="d-flex align-items-center">
                        <!-- Profile Image -->
                        <img src="{% static 'img/chef.png' %}" alt="Profile" 
                             class="rounded-circle me-2 img-fluid" style="width: 50px; min-width: 40px;">
            
                        <!-- Fullscreen Button -->
                        <button id="fullscreen-btn" class="btn fullscreen-btn">
                            <i id="fullscreen-icon" class="fa fa-expand"></i>
                        </button>
                    </div>
                </div>
            </header>
            

            <!-- Main Section -->
             <main>
                {% block main%}
                
                {%endblock%}
             </main>
        </div>
    </div>       


    
</body>
</html>
