<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {%block title %}
        LEAR|CMMS
        {% endblock %}
    </title>
    <link rel="icon" type="image/png" href="{% static 'img/lear_mini_logo.png' %}">
    <!--local css-->
    <link href="{% static 'css/main.css' %}" rel="stylesheet">

    <!-- Local Bootstrap CSS -->
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <!-- Local Bootstrap Bundle JS -->

    <script src="{% static 'js/Chart.bundle.min.js' %} " defer></script>

    <script src="{% static 'bootstrap/js/bootstrap.min.js' %}" defer></script>
    <script src="{% static 'js/main.js' %}" defer></script>
</head>

<body>
    <!-- Loader -->
    <div id="loader">
        <div class="text-center">
            <div class="spinner-border text-danger" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="loading-text">Loading...</p>
        </div>
    </div>



    <div class="d-flex">
        <!-- Sidebar -->
        <aside class="sidebar d-md-block">
            <div class="mb-4 text-center">
                <img src="{% static 'img/lear_logo.png' %}" alt="Lear Logo" class="img-fluid" style="max-height: 50px;">
            </div>
            <nav class="nav flex-column">
                <!-- <a href="EQcards.html" class="nav-link link"><i class="fas fa-box me-2"></i>Équipement</a>
                <a href="department.html" class="nav-link link"><i class="fas fa-map-marker-alt me-2"></i>Zones</a> -->
                <a href="{% url 'users:admin'  %}" class="nav-link link "><i class="fas fa-home me-2"></i>Home</a>
                <a href="{% url 'maintenance:work_order'  %}" class="nav-link link"><i class="fas fa-clipboard-list me-2"></i>Work orders</a>
                <a href="{% url 'maintenance:intervention_history' %}" class="nav-link link"><i
                        class="fas fa-tools me-2"></i>History</a>
                <a href="{% url 'maintenance:dashboard'  %}" class="nav-link link"><i class="fas fa-eye me-2"></i>Monitoring</a>
                <a href="{% url 'maintenance:machines_charts'  %}" class="nav-link link"><i
                        class="fas fa-cogs me-2"></i>Machines</a>
                
                <a href="{% url 'users:users_list'  %}" class="nav-link link"><i
                        class="fas fa-users me-2"></i>Users</a>
            </nav>
        </aside>

        <!-- Main Content -->

        <div class="flex-grow-1">

            <header class="d-flex align-items-center justify-content-between px-3 py-2">
                <button class="btn d-md-none" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h2 class="m-0">Welcome {{ user.first_name}}</h2>
                <div class="d-flex align-items-center">
                    <form class="logout me-3" action="{% url 'users:logout'%}" method="post">
                        {% csrf_token %}
                        <button aria-label="logout" title="logout" class="border-0 bg-transparent p-0">
                            <img src="{% static 'img/chef.png' %}" alt="Profile" class="rounded-circle img-fluid"
                                style="width: 50px; min-width: 40px;">
                        </button>
                    </form>

                    <!-- Fullscreen Button -->
                    <button id="fullscreen-btn" class="btn">
                        <i id="fullscreen-icon" class="fa fa-expand"></i>
                    </button>
                </div>
            </header>


            <!-- Main Section -->
            <main>
                {% block main%}

                {%endblock%}
            </main>
        </div>
    </div>
<script>document.addEventListener('DOMContentLoaded', function() {
    const toggleButton = document.getElementById('sidebarToggle');
    const sidebar = document.querySelector('.sidebar');

    toggleButton.addEventListener('click', function() {
        sidebar.classList.toggle('d-none');
    });
});</script>


</body>

</html>
