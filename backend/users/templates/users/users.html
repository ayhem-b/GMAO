{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="GMAO - Dashboard">
    <meta name="author" content="Belkhamsa ayhem">

    <title>USER</title>


    <link rel="icon" type="image/png" href="{% static 'img/lear_mini_logo.png' %}">
    <!--local css-->
    <link href="{% static 'css/main.css' %}" rel="stylesheet">

    <!-- Local Bootstrap CSS -->
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <!-- Local Bootstrap Bundle JS -->

    <script src="{% static 'js/Chart.bundle.min.js' %} " defer></script>

    <script src="{% static 'bootstrap/js/bootstrap.min.js' %}" defer></script>
    <script src="{% static 'js/main.js' %}" defer></script>

</head>

<body>
    <!-- Loader -->
    <div id="loader">
        <div class="text-center">
            <div class="spinner-border text-danger" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="loading-text">Chargement en cours...</p>
        </div>
    </div>

    <div class="d-flex">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="mb-4 text-center">
                <img src="{% static '/img/lear_logo.png' %}" alt="Lear Logo" class="img-fluid"
                    style="max-height: 50px;">
            </div>
            <nav class="nav">
                <a href="/users/" class="nav-link link"><i class="fas fa-tools me-2"></i>Intervention</a>

                <a href="workorder.html" class="nav-link link"><i class="fas fa-clipboard-list me-2"></i>Ordre de
                    travail</a>
            </nav>
        </aside>

        <div class="flex-grow-1">
            <!-- Header -->
            <header class="d-flex align-items-center justify-content-between px-3 py-2">
                <h2 class="m-0">Bienvenue {{ user.first_name}}</h2>

                <div class="d-flex align-items-center">
                    <form class="logout me-3" action="{% url 'users:logout'%}" method="post">
                        {% csrf_token %}
                        <button aria-label="logout" title="logout" class="border-0 bg-transparent p-0">
                            <img src="{% static 'img/technicien.png' %}" alt="Profile" class="rounded-circle img-fluid"
                                style="width: 50px; min-width: 40px;">
                        </button>
                    </form>

                    <!-- Fullscreen Button -->
                    <button id="fullscreen-btn" class="btn">
                        <i id="fullscreen-icon" class="fa fa-expand"></i>
                    </button>
                </div>
            </header>
            <!-- Statistic Section -->
            <section class="container my-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="container my-4">
                        <h2 class="text-center">Intervention</h2>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="technician-name" class="form-label">Nom & Prénom Technicien:</label>
                                <input type="text" class="form-control" id="technician"
                                    value="{{ user.first_name }} {{ user.last_name }}" readonly>
                            </div>
                            <div class="col-md-3">
                                <label for="matricule" class="form-label">Matricule:</label>
                                <input type="text" class="form-control" id="technicien" value="{{ user.username }}"
                                    readonly>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-3">
                                <label for="received-date" class="form-label">Reçu le:</label>
                                <input type="datetime-local" class="form-control" name="received_date" required>
                            </div>
                            <div class="col-md-3">
                                <label for="end-date" class="form-label">Fin le:</label>
                                <input type="datetime-local" class="form-control" name="end_date">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Catégorie de Panne:</label>
                            <ul class="form-control list-unstyled">
                                <li><input type="radio" name="fault_category"> <label value="MNP">Maint Non
                                        Planifié (MNP)</label></li>
                                <li><input type="radio" name="fault_category"> <label value="MCP">Maint Curatif
                                        Planifié (MCP)</label></li>
                                <li><input type="radio" name="fault_category"> <label value="AUT">Trav Divers ou
                                        Amélioration (AUT)</label></li>
                            </ul>

                        </div>

                        <div class="mb-3">
                            <label class="form-label">Code Défaut 1 (What):</label><br>
                            <input type="checkbox" name="fault_what" value="Mécanique"> Mécanique<br>
                            <input type="checkbox" name="fault_what" value="Électrique"> Électrique<br>
                            <input type="checkbox" name="fault_what" value="Pneumatique"> Pneumatique<br>
                            <input type="checkbox" name="fault_what" value="Hydraulique"> Hydraulique<br>
                            <input type="checkbox" name="fault_what" value="Maintenance"> Maintenance<br>
                            <input type="checkbox" name="fault_what" value="Logiciel"> Logiciel<br>
                            <input type="checkbox" name="fault_what" value="Inspection"> Inspection<br>
                        </div>


                        <div class="mb-3">
                            <label class="form-label">Commentaires:</label>
                            <textarea name="comments" class="form-control" rows="3"></textarea>
                        </div>

                        <button type="submit" class="btn btn-danger">Submit</button>
                    </div>
                </form>



            </section>

        </div>

</body>

</html>
