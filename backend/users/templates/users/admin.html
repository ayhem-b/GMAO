{% extends 'users/admin_layout.html'  %}

{% block title %}
    Dashboard
{% endblock %}
{% block main %}
 <!-- Main Section -->
 <section class="container my-4">
    <div class="container mt-4"  > <!-- Set height to center vertically -->
    <div class="row h-100 justify-content-center align-items-center">
        <!-- Card 1 -->
        <div class="col-md-2">
            <div class="card text-white text-center bg-danger mb-3">
                <div class="card-header">Total Interventions</div>
                <div class="card-body">
                    <h5 class="card-title" id="total-interventions">0</h5>
                </div>
            </div>
        </div>
        <!-- Card 2 -->
        <div class="col-md-2">
            <div class="card text-white text-center bg-danger mb-3">
                <div class="card-header">Total Downtime</div>
                <div class="card-body">
                    <h5 class="card-title" id="total-downtime">0h 0m</h5>
                </div>
            </div>
        </div>
    </div>
    </div>
        <div class="container mt-4 ">
        
        
            <!-- Charts Section -->
            <div class="row row-cols-1 row-cols-md-2 g-4">
                <div id="total-interventions"></div>
                <div id="total-downtime"></div>

                <!-- Display Charts -->
                <div class="col-md-6">
                    <div class="card shadow-sm border-danger">
                        <div class="card-header bg-danger text-white">Maintenance Category</div>
                        <div class="card-body">
                            <canvas id="categoryChart"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card shadow-sm border-danger">
                        <div class="card-header bg-danger text-white text-center">USERS</div>
                        <div class="card-body">
                            <canvas id="interventionUserChart"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card  shadow-sm border-danger"     >
                        <div class="card-header bg-danger text-white text-center">WHAT DEFAULTS</div>
                        <div class="card-body">
                            <canvas id="faultWhatChart"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card shadow-sm border-danger">
                        <div class="card-header bg-danger text-white text-center">WHY DEFAULTS</div>
                        <div class="card-body">
                        <canvas id="faultWhyChart"></canvas>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="card shadow-sm border-danger">
                        <div class="card-header bg-danger text-white text-center">WHERE DEFAULTS</div>
                        <div class="card-body">
                            
                            <canvas id="faultWhereChart"></canvas>
                        </div>
                    </div>
                </div>
                    
                <div class="col-md-6">
                    <div class="card shadow-sm border-danger">
                        <div class="card-header bg-danger text-white text-center">Timeline</div>
                        <div class="card-body">
                            <canvas id="timelineChart"></canvas>
                        </div>
                    </div>
                </div>

                
                
            
            </div>
        </div>
    </div>
  
   
</section>
  <!-- Chart.js Script -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
    const colorMap = {};
    let charts = {};
    let firstLoad = true;

    function getColorForLabel(label) {
        if (!colorMap[label]) {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            colorMap[label] = color;
        }
        return colorMap[label];
    }

    function createOrUpdateChart(id, type, labels, dataValues, labelText, useRandomColors = false) {
        const ctx = document.getElementById(id);
        if (!ctx) return;

        // Destroy old chart if it exists
        if (charts[id]) {
            charts[id].destroy();
        }

        const backgroundColors = useRandomColors
            ? labels.map(label => getColorForLabel(label))
            : "#dc3545";

        charts[id] = new Chart(ctx, {
            type: type,
            data: {
                labels: labels,
                datasets: [{
                    label: labelText,
                    data: dataValues,
                    backgroundColor: backgroundColors,
                    borderColor: backgroundColors,
                    fill: type === "line"
                }]
            },
            options: {
                responsive: true,
                animation: firstLoad,  // Animate only on first load
                scales: (type === 'bar' || type === 'line') ? {
                    y: {
                        beginAtZero: true
                    }
                } : undefined
            }
        });
    }

    function updateDashboard() {
        fetch("{% url 'maintenance:intervention_data' %}")
            .then(response => response.json())
            .then(data => {
                // Update text
                const totalInterventions = data.categories.values.reduce((a, b) => a + b, 0);
                const downtime = data.downtime.values[0];
                document.getElementById("total-interventions").innerText = totalInterventions;
                document.getElementById("total-downtime").innerText = `${Math.floor(downtime)}h ${Math.round((downtime % 1) * 60)}m`;

                // Update all charts
                createOrUpdateChart("categoryChart", "pie", data.categories.labels, data.categories.values, "Fault Categories", true);
                createOrUpdateChart("faultWhatChart", "bar", data.faults_what.labels, data.faults_what.values, "Fault What");
                createOrUpdateChart("faultWhyChart", "bar", data.faults_why.labels, data.faults_why.values, "Fault Why");
                createOrUpdateChart("faultWhereChart", "bar", data.faults_where.labels, data.faults_where.values, "Fault Where", true);
                createOrUpdateChart("interventionUserChart", "pie", data.users.labels, data.users.values, "Interventions per User", true);
                createOrUpdateChart("timelineChart", "line", data.timeline.labels, data.timeline.values, "Interventions Over Time");
                createOrUpdateChart("sparePartsChart", "bar", data.spare_parts.labels, data.spare_parts.values, "Spare Parts");

                // After first load, disable animation for future updates
                firstLoad = false;
            })
            .catch(error => {
                console.error("Error fetching dashboard data:", error);
            });
    }

    updateDashboard(); // Initial load with animation
    setInterval(updateDashboard, 500); // Update every 30s without animation
    });
</script>


{% endblock  %}
