<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add a Machine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="card shadow p-4">
    <h2 class="mb-4 text-center text-danger">Add a Machine</h2>
    <form method="POST" >
      {% csrf_token %}
      
      <div class="mb-3">
        <label for="name" class="form-label">Machine Name</label>
        <input type="text" class="form-control" id="name" name="name" placeholder="Enter machine name" required>
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">Machine Description</label>
        <textarea class="form-control" id="description" name="description" placeholder="Describe the machine" rows="3"></textarea>
      </div>

      <div class="mb-3">
        <label for="location" class="form-label">Location</label>
        <input type="text" class="form-control" id="location" name="location" placeholder="Enter location" required>
      </div>

      <div class="mb-3">
        <label for="serial_number" class="form-label">Serial Number</label>
        <input type="text" class="form-control" id="serial_number" name="serial_number" placeholder="Enter serial number">
      </div>

      <button type="submit" class="btn btn-danger w-100">Submit Machine</button>
    </form>
  </div>
</div>

</body>
</html>
